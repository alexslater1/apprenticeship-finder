name: scrape

on:
  schedule:
    # 06:23 UTC daily (off the hour to dodge Actions congestion). Runs from the default branch only.
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source ids to run (blank = all; "employers" = every watched employer)'
        required: false
        default: ''
      employers:
        description: 'Comma-separated employer ids to check (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no database writes, no email)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # keepalive commit of data/last-run.json
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FAA_API_KEY: ${{ secrets.FAA_API_KEY }}
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      SOURCES: ${{ inputs.sources }}
      EMPLOYERS: ${{ inputs.employers }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Amazing Apprenticeships source converts its PDF with pdftotext.
      - name: Install poppler
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Scrape
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$SOURCES" ] && args+=(--source "$SOURCES")
          [ -n "$EMPLOYERS" ] && args+=(--employer "$EMPLOYERS")
          npm run scrape -w packages/scraper -- "${args[@]}"

      - name: Digest
        if: env.DRY_RUN != 'true'
        run: npm run digest -w packages/scraper

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Email on failure
        if: failure() && env.DRY_RUN != 'true'
        run: npm run cli -w packages/scraper -- notify-failure

      # GitHub disables cron in public repos after 60 days without activity; a tiny daily
      # commit keeps it alive (PLAN.md §9.1). No private data in this file.
      - name: Keepalive commit
        if: env.DRY_RUN != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/last-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: last run [skip ci]'
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1

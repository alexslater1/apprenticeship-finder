<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Level 6 Data Science Degree Apprenticeship","description":"\u003Cp\u003E\u003Cstrong\u003EAre you looking for an exciting opportunity to develop cutting-edge data science skills and solve real-world business challenges? \u003C/strong\u003E\u003C/p\u003E\n\u003Cp\u003EDo you enjoy working with data, uncovering patterns, and using evidence to influence decisions? Are you curious about how artificial intelligence, machine learning, and advanced analytics can help businesses innovate and improve performance? Our Data Scientist Apprenticeship provides an excellent opportunity to launch your career in data science while learning from industry experts within a leading technology company.\u003C/p\u003E\n\u003Ch3\u003EBenefits of the programme\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003EEarn while you learn with a competitive salary.\u003C/li\u003E\n\u003Cli\u003EGain hands-on, job-specific training and real-world experience.\u003C/li\u003E\n\u003Cli\u003EAchieve a recognised professional qualification.\u003C/li\u003E\n\u003Cli\u003ESecure a permanent role from the start of your apprenticeship\u003C/li\u003E\n\u003Cli\u003EEnjoy fully funded tuition fees on approved training programmes.\u003C/li\u003E\n\u003Cli\u003ELearn from experienced professionals and develop skills that will support your long-term career growth.\u003C/li\u003E\n\u003Cli\u003EBuild valuable experience and develop your career in data science\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3\u003EAbout the Role\u003C/h3\u003E\n\u003Cp\u003EAs a Data Scientist Apprentice, you will be valued for your curiosity, analytical mindset, and passion for solving problems using data. You will work with a variety of datasets, tools, and technologies to identify trends, build predictive models, and generate insights that support business decision-making.\u003C/p\u003E\n\u003Cp\u003EWorking alongside experienced data professionals, you will learn how to transform raw data into valuable business intelligence and help develop data-driven solutions that create measurable impact.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EYour responsibilities may include:\u003C/strong\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EIdentifying business challenges and using data science techniques to recommend solutions.\u003C/li\u003E\n\u003Cli\u003ECollecting, preparing, cleansing, and analysing data from multiple sources.\u003C/li\u003E\n\u003Cli\u003EBuilding skills in: Data Science and Analytics; Machine Learning and Artificial Intelligence; Statistical Analysis; Data Engineering Fundamentals; Data Visualisation and Storytelling; Programming and Automation (e.g. Python, SQL)\u003C/li\u003E\n\u003Cli\u003ESupporting the development and testing of predictive models and analytical solutions.\u003C/li\u003E\n\u003Cli\u003EWorking with data teams to create data products, dashboards, and insights used across the business.\u003C/li\u003E\n\u003Cli\u003EEvaluating model performance and supporting continuous improvement of analytical solutions.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3\u003EWhat You Will Learn\u003C/h3\u003E\n\u003Cp\u003EThroughout the apprenticeship, you will gain experience and knowledge in:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EData collection, preparation, and management techniques.\u003C/li\u003E\n\u003Cli\u003EStatistical methods and hypothesis testing.\u003C/li\u003E\n\u003Cli\u003EProgramming languages such as Python and SQL.\u003C/li\u003E\n\u003Cli\u003EMachine learning concepts and model development.\u003C/li\u003E\n\u003Cli\u003EData visualisation and storytelling techniques.\u003C/li\u003E\n\u003Cli\u003EExploratory and predictive analytics.\u003C/li\u003E\n\u003Cli\u003EArtificial Intelligence fundamentals and responsible AI practices.\u003C/li\u003E\n\u003Cli\u003EData governance, ethics, and compliance.\u003C/li\u003E\n\u003Cli\u003ECloud-based analytics and data science platforms.\u003C/li\u003E\n\u003Cli\u003EBusiness and stakeholder engagement skills.\u003C/li\u003E\n\u003Cli\u003ECommunicating technical findings to both technical and non-technical audiences.\u003C/li\u003E\n\u003Cli\u003EProject management and agile ways of working.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3\u003EApprenticeship Programme\u003C/h3\u003E\n\u003Cp\u003EYou will study towards a Level 6 Data Scientist Apprenticeship with The University of Nottingham.\u003C/p\u003E\n\u003Cp\u003EThe programme is delivered over 42 months through a blend of:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EOn-campus learning\u003C/li\u003E\n\u003Cli\u003EOnline study\u003C/li\u003E\n\u003Cli\u003EWorkplace-based learning\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EYou will typically attend university for a minimum of 4 weeks each academic year, delivered in 1-week blocks.\u003C/p\u003E\n\u003Cp\u003EOn successful completion of the programme and End Point Assessment, you will achieve:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EA fully funded BSc (Hons) Data Science degree\u003C/li\u003E\n\u003Cli\u003EA Level 6 Data Scientist Degree Apprenticeship qualification\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3\u003EEntry Requirements\u003C/h3\u003E\n\u003Cp\u003ETo apply, you will need:\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EA Levels\u003C/strong\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E3 A levels (BBC) including Maths (Citizenship Skills, General Studies and Critical Thinking are not accepted)\u003C/li\u003E\n\u003Cli\u003EOr a Level 4 Data Analyst qualification will be considered on a case-by-case basis\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u003Cstrong\u003EGCSEs\u003C/strong\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EMinimum of five GCSEs at Grade 4/C or above (Maths at Grade 5/C or above)\u003C/li\u003E\n\u003Cli\u003EMust include: English Language; Mathematics\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EPlease note that those with a relevant degree will not be eligible for this programme.\u003C/p\u003E\n\u003Ch3\u003EBenefits\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003ECompetitive salary of £24,000 per annum\u003C/li\u003E\n\u003Cli\u003EPerformance-related pay uplifts\u003C/li\u003E\n\u003Cli\u003EHoliday entitlement of 201 hours a year (plus a company day and bank holidays)\u003C/li\u003E\n\u003Cli\u003EContributory Company Pension\u003C/li\u003E\n\u003Cli\u003EHealth Care Cash Plan\u003C/li\u003E\n\u003Cli\u003EHybrid/flexible working options\u003C/li\u003E\n\u003Cli\u003EEmployee assistance programme\u003C/li\u003E\n\u003Cli\u003ELearning and development support\u003C/li\u003E\n\u003Cli\u003EEmployee discounts and wellbeing initiatives\u003C/li\u003E\n\u003Cli\u003ELife Cover\u003C/li\u003E\n\u003Cli\u003E80 Hours Volunteering per year (first two years)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3\u003EApply\u003C/h3\u003E\n\u003Cp\u003E\u003Cstrong\u003EThales Apprentice Recruitment Process\u003C/strong\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EApply Online - submit your application online to register your interest. You only need to register for one role as you will have the opportunity to apply for additional roles at the full application stage.\u003C/li\u003E\n\u003Cli\u003EUpload Your CV\u003C/li\u003E\n\u003Cli\u003ECheck your emails for the invitation to apply – this will come from recruiting@jobalerts.thalesgroup.com\u003C/li\u003E\n\u003Cli\u003EComplete Your Application – follow the link provided in the email to complete your application. You can apply for one primary role and up to 3 additional roles.\u003C/li\u003E\n\u003Cli\u003EComplete Online Tests - undertake the online assessments designed to evaluate your suitability for the role.\u003C/li\u003E\n\u003Cli\u003EVirtual Assessment Centre - candidates who progress from the online assessment stage will attend a virtual assessment centre, which will include group exercises, and competency-based interviews.\u003C/li\u003E\n\u003Cli\u003EJob Offer – successful candidates who perform well throughout the recruitment process will receive a job offer from Thales.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EFor further information about our Future Talent recruitment process, including hints and tips, or to connect with a member of the Future Talent Team, a Graduate, or an Apprentice, please visit Thales Future Talent - Connectr.\u003C/p\u003E\n\u003Cp\u003EPlease note, assessment centres for shortlisted candidates will be held between February - May 2027. Induction week for all Graduate and Apprentices will take place from Monday 6 September - Friday 10 September 2027.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EClosing date:\u003C/strong\u003E Our applications will close at 11.59pm on Wednesday 17 February 2027, this is the only time we will be accepting applications this year. Please note, we will be in contact by the end of February 2027 with details of next steps.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EPLEASE NOTE THAT ROLES MAY CLOSE EARLIER THAN THE ADVERTISED DEADLINE IF WE RECEIVE A HIGH NUMER OF APPLICATIONS. WE ENCOURAGE YOU TO APPLY AS SOON AS POSSIBLE TO AVOID MISSING OUT ON THIS OPPORTUNITY.\u003C/strong\u003E\u003C/p\u003E\n\u003Cp\u003EBecause of the work we do at Thales, all roles are subject to security requirements.\u003C/p\u003E\n\u003Cp\u003ETo be considered for this position, you must have the permanent right to work in the UK and be able to successfully complete and maintain UK Government security checks, including Baseline Personnel Security Standard (BPSS) screening and Security Clearance (SC), which is a government background check, before starting employment.\u003C/p\u003E\n\u003Cp\u003ETo be eligible for SC clearance, you will typically need to have lived in the UK continuously for the last five years. As part of the vetting process, you will be asked to provide evidence of your identity, right to work in the UK, any time spent overseas during the last five years, and your employment and/or education history.\u003C/p\u003E\n\u003Ch3\u003EHow to apply\u003C/h3\u003E\n\u003Cp\u003ETo apply for this role and to find out more, please click on the apply button. Please note that applications may close before the application deadline, so apply early to avoid disappointment.\u003C/p\u003E","datePosted":"2026-10-05","validThrough":"2027-02-17","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"Thales","sameAs":"https://ad.doubleclick.net/ddm/clk/296910323;123930634;b","logo":{"@type":"ImageObject","url":"https://imagekit-production.higherin.com/prod-higherin/tr:w-400,h-400,f-orig/companies/563/logos/744_200x200_1445336481.jpg","alternateName":"company logo"},"description":"About Thales\nThales is where technology meets real-world impact.\nAs a global technology leader, we design and deliver solutions that millions of people rely on every day, often without even realising it. From the secure payment cards in your wallet and digital identity technologies that protect online transactions, to advanced cyber security, defence, aerospace and space systems, we help keep people connected, protected and moving.\nWith over 80,000 colleagues across more than 65 countries and more than 7,800 employees in the UK, we're a diverse community of innovators, engineers, problem-solvers and future-shapers. Our UK teams are based across locations including Crawley, Reading, Bristol, Glasgow, Belfast, Manchester and Templecombe, working together to solve some of society's most complex challenges.\nFor our graduates and apprentices, this means you will work on meaningful projects from day one. You could be developing technology that protects critical national infrastructure, helping secure digital payments for millions of people, supporting the next generation of air traffic management systems, designing advanced sensors and communications technologies, or contributing to innovations that reach beyond our planet.\nAt Thales, you'll be trusted with real responsibility, supported by experienced mentors, and encouraged to bring your ideas to life. Whatever your background, we'll help you develop the skills, confidence and experience to build an exciting career while helping us create a future we can all trust.","url":"https://higherin.com/company-profile/563/thales"},"baseSalary":{"@type":"MonetaryAmount","currency":"GBP","value":{"@type":"QuantitativeValue","unitText":"YEAR","value":24000}},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"Manor Royal","addressLocality":"Crawley","addressRegion":"West Sussex","addressCountry":"United Kingdom","postalCode":"RH10 9HA"}}]}</script>

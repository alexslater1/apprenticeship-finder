eporting . You will also help identify opportunities to improve the platform over time . Provide insight into the digital customer experience. Work with Digital Product Managers and the User Experience Research Manager to analyse customer behaviour and provide insights that support the development of our customer - facing digital products. This will give you practical experience of working with Google Analytics data. Your ‘day-to-day’: Cleaning, managing and analysing large datasets. Supporting the design and delivery of customer surveys. Checking data quality and identifying inconsistencies. Collaborating with Operations, Sustainability, Group Technology and the Digital Solutions Team. Creating new dashboards and improving existing ones to communicate insights clearly. Contributing to regular reporting for the London Estate and Operations teams. Presenting findings to internal stakeholders. Documenting data sources, definitions and analytical processes. Desirable skills: Proactive, curious and self-motivated. Able to demonstrate a growth mindset and a willingness to learn. Able to work iteratively and collaboratively. Strong attention to detail and a commitment to data accuracy. Strong written and verbal communication skills. Able to turn analytical findings into clear, accessible presentations that explain why the insights matter. Interested in learning to use tools such as SQL, Microsoft Fabric, Google Analytics and Power BI. Interested in how data can support better business and customer decisions. You do not need to have used all of these tools before. We are looking for someone with curiosity, analytical thinking and a genuine interest in learning how data can support better business and customer decisions. Entry requirements: Level 3 qualification (apprenticeship/A-levels/BTEC, etc) OR equivalent work experience (typically two years in a relevant role) Plus: 5 GCSEs, including English and Maths at Grade 4 (C) or above Experience with using Excel (in particular pivot tables and XLookup) and Microsoft products (or similar) Working hours: 35 hours per week, 9:30am - 5:30pm, Monday to Friday Benefits: Pension &amp; Life Assurance Career Average Revalued Earnings (CARE) defined benefit pension scheme (capped at £45k) Life Assurance 4x annual salary with spousal and dependent pension Annual Leave Private Medical Insurance Subsidised Lunch Employee Support Serious Condition Support Dental Insurance Healthcare Cash Plan Discount Site Wellhub Season Ticket Loan Grosvenor offers an annual season ticket loan of up to £10,000. Available after successful completion of your probation period. Cycle to Work Buy / Sell Annual Leave Health Screenings Mortgage Advice Service Workplace ISA Electric Car Leasing Scheme Worklife Central platform Volunteer Days Flexible Working Future prospects: 90% of QA apprentices secure permanent employment after completing: this is 20% higher than the national average. About QA: Our apprenticeships are the perfect way to gain new skills, earn while you learn, and launch yourself into an exciting future. With over 50,000 successful apprenticeship graduates, we're a top 50 training provider, dedicated to helping you succeed. Interested? Apply now!","inLanguage":"en-GB","isPartOf":{"@id":"https://notgoingtouni.co.uk/#website"},"breadcrumb":{"@id":"https://notgoingtouni.co.uk/qa/opportunity-detail/data-analyst-apprentice-jobs-in-it-technology-london-greater-london-12827#breadcrumb"},"image":"https://api.notgoingtouni.co.uk/media/providers/header/qa-260806-125951-header-image.webp","mainEntity":{"@id":"https://notgoingtouni.co.uk/qa/opportunity-detail/data-analyst-apprentice-jobs-in-it-technology-london-greater-london-12827#job"}},{"@type":"JobPosting","@id":"https://notgoingtouni.co.uk/qa/opportunity-detail/data-analyst-apprentice-jobs-in-it-technology-london-greater-london-12827#job","title":"Data Analyst Apprentice jobs in IT & Technology London GREATER LONDON","description":"\u003cp>\u003cstrong>Grosvenor

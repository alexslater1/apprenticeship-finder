<p>Whichever path you choose, you&#8217;ll play a meaningful role in helping us deliver nationally important work, develop specialist skills and build a career with purpose.</p>
<h3>Our Graduate Development Scheme</h3>
<p>Our Graduate Development Scheme is a structured two-year programme designed to help you build the foundations of a successful and rewarding career. From day one, you&#8217;ll gain real responsibility, develop technical expertise and work alongside industry-leading professionals on projects that make a genuine difference. Through a blend of professional development, on-the-job learning and support towards chartership, you&#8217;ll have everything you need to grow your confidence, expand your skills and become a future specialist in your field. Whether you&#8217;re looking to develop your technical expertise, build your professional network or accelerate your career, we&#8217;ll give you the opportunities, support and experience to help you reach your potential.</p>
<h3>What You’ll Get </h3>
<p>Our graduates start off with a 24-month fixed term contract, with an excellent starting salary of £44,027, rising to £45,010 in Year 2. Following successful completion of your graduate programme and subject to there being a suitable vacancy, you could be offered a permanent position with us. </p>
<p>If you’re relocating here from more than 30 miles away, we’ll support you with a relocation allowance of £1,400. £1,400 can provide you with rent cover for up to 3-months in some areas of West Cumbria. </p>
<p>We know that moving on from university isn’t always easy. That’s why all our graduates can also apply for an interest free loan of £2,000 which you pay back through your monthly salary over your 24-month contract. </p>
<p>We aim to strike a good work/life balance by offering 30 days annual leave with statutory public holidays on top. There is also the ability to purchase an additional 2.5 days leave on top. </p>
<p>We also offer an attractive defined contribution pension scheme – the company will match up to 13.5% for a 7% employee contribution, helping you to save for the future from the start of your career. </p>
<p>All our employees can also benefit from our 18 support networks, including the Nuclear Autism Support Network, oneLGBTQ+ Network and Gender Balance Networks, to name a few. </p>
<p>Other benefits include paid sick leave scheme, cycle to work scheme, family friendly policies, welfare & employee assistance programme, employee savings & discounts, plus many others.</p>
<h3>What we’ll need from you</h3>
<p>We want you to succeed with us, so we’re asking for you to:</p>
<p>• Be on track to achieve, or have already achieved, a minimum of a 2:1 in a relevant subject to the scheme you&#8217;re applying to (please refer to the individual scheme requirements for full details). For our Projects & People schemes, the minimum grade required is a 2:2,<br />
• Have a willingness to relocate to West Cumbria for the duration of the programme.<br />
• Have a commitment to working on or around the Sellafield site and supporting the delivery of our mission to create a clean and safe environment for future generations.<br />
• Have a genuine interest in building a career within the nuclear industry and developing your professional and technical expertise.<br />
• Have the ability to solve problems, think critically and approach challenges with curiosity and a willingness to learn.<br />
• Have the drive to take ownership of your own development and make the most of the opportunities available through the programme.<br />
• Have a proactive attitude, a willingness to try new things and the resilience to work through complex challenges.<br />
• Have a commitment to upholding the highest standards of safety, security and professionalism.<br />
• Eligibility to obtain and maintain the security clearance required for the role. </p>
<p>We&#8217;re looking for people who are curious, motivated and ready to make a difference. You don&#8217;t need nuclear experience, but you do need the enthusiasm to learn, the confidence to challenge yourself and the ambition to help deliver work that will have a lasting impact for generations to come.</p>
<h3>Life in Cumbria</h3>
<p>Build a career that makes a difference from day one. With us, you won&#8217;t be spending your graduate programme on the sidelines. You&#8217;ll work on real projects that help tackle some of the UK&#8217;s biggest environmental, engineering and nuclear challenges, while contributing to our mission of creating a clean and safe environment for future generations. Based in West Cumbria, on the edge of the Lake District, you&#8217;ll be part of a team developing innovative solutions that support the UK&#8217;s sustainable future, reduce environmental risk and leave a lasting positive impact for generations to come.<br />
Alongside structured development, professional support and world-class expertise, you&#8217;ll gain experience that&#8217;s genuinely hard to find anywhere else.</p>
<p>You’ll be working directly on our site in West Cumbria, right on the edge of the breathtaking Lake District National Park. It’s a place where your weekends can be filled with hiking, cycling, or kayaking and your evenings end with sunsets over the fells. Away from the bustle of big cities you’ll enjoy fresh air, open space and a lower cost of living – without missing out on communities, activities or connections. And when you do fancy a city break, Manchester, Newcastle and Glasgow are just a few hours away. It’s the perfect balance of career opportunity and quality of life. </p>
<p>Enjoy affordable housing and living costs that go much further than big cities. Rural doesn’t mean isolated, you’ll still find shops, restaurants and gyms – just without the city chaos.</p>
<h3>Our Application Process</h3>
<p>• Applications for our Graduate Programmes close on Friday 23rd October 2026.<br />
• Please apply for one Graduate vacancy only. We encourage you to explore all available opportunities and select the role that best aligns with your skills, qualifications, and career aspirations. To ensure a fair and consistent recruitment process for all candidates, applications to multiple graduate vacancies will not be considered.<br />
• Once you&#8217;ve applied, you&#8217;ll be invited to complete an online assessment. The date you receive this will depend on when you submit your application. You&#8217;ll be given a deadline to complete it and can expect to receive your outcome in mid-November.<br />
• Video interviews will take place between 2nd – 20th November 2026.<br />
• For Cumbria-based schemes, face-to-face Assessment Centres will be held in Workington, Cumbria, from 1st – 4th December 2026.<br />
• We don&#8217;t want travel costs to be a barrier. Financial support is available for candidates who may struggle to cover travel expenses upfront when attending an assessment centre.<br />
• Please note that if you&#8217;re unable to attend an assessment stage during the dates outlined above, you may not be able to progress through the recruitment process.<br />
• Expected start date: Monday 27th September 2027. </p>
<p>Accessibility and Inclusion</p>
<p>• At Sellafield, we&#8217;re committed to creating an inclusive and supportive recruitment experience where everyone can succeed.<br />
• We&#8217;re proud to be recognised as a Disability Confident Leader and welcome applications from people from all backgrounds and experiences.<br />
• Reasonable adjustments are available throughout every stage of our recruitment process, including online assessments, video interviews and assessment centres.<br />
• If you require any adjustments or additional support, we&#8217;ll work with you to make sure you can demonstrate your skills and perform at your best.<br />
• If you&#8217;d like to discuss any support requirements before or during your application, please contact our recruitment team. We&#8217;re happy to help and encourage candidates to speak to us as early as possible so we can ensure the right support is in place.</p>

<p>From graduate to nuclear professional – your journey begins here. Join us and help shape the UK’s sustainable nuclear future with a company built on history.</p>
